<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angličtina RPG – Věž slovíček</title>
<style>
:root{
  --ink:#2b1a10; --wood:#8a5a2b; --wood-d:#5e3a18; --parch:#f6e3b4; --parch-d:#e2c78a;
  --red:#d9372b; --green:#3fa34d; --blue:#2f7fd1; --gold:#f2b705; --purple:#8a3fc7;
  --r-green:#3fa34d; --r-blue:#2f7fd1; --r-yellow:#f2b705;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 3px,transparent 3px 46px),radial-gradient(circle at 50% 0,#ffd98a 0,#e59a4a 45%,#8a4a22 100%) fixed}
h1{display:inline-block;background:var(--red);color:#fff;border:5px solid var(--ink);border-radius:10px;padding:6px 22px;transform:rotate(-2deg);box-shadow:0 5px 0 var(--ink);text-shadow:3px 3px 0 var(--ink);font-size:2rem}
h1,h2,h3{font-family:Impact,"Arial Black",sans-serif;letter-spacing:1px;margin:.2em 0;text-transform:uppercase;text-shadow:2px 2px 0 rgba(255,255,255,.4)}
#app{max-width:900px;margin:0 auto;padding:16px}
.screen{display:none}.screen.active{display:block}
.panel{background:linear-gradient(var(--parch),var(--parch-d));border:5px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--wood-d),0 0 0 4px var(--wood);padding:18px;margin:12px 0}
.btn{font:inherit;font-weight:900;font-size:1.05rem;color:#fff;background:var(--red);border:4px solid var(--ink);border-radius:12px;
  padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-shadow:1px 1px 0 var(--ink);transition:transform .08s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#999;cursor:not-allowed;opacity:.7}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none}.btn.purple{background:var(--purple)}
.btn.small{font-size:.8rem;padding:6px 10px;margin:2px}
input[type=text]{font:inherit;font-size:1.1rem;padding:10px;border:4px solid var(--ink);border-radius:10px;width:100%;background:#fffbe9}
.center{text-align:center}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.lvl{padding:12px 4px;text-align:center;font-weight:900;font-size:1.3rem;background:#fffbe9;border:4px solid var(--ink);border-radius:12px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.lvl small{display:block;font-size:.65rem;font-weight:700}
.lvl.sel{background:var(--gold);transform:translateY(-3px)}
.hero-pick{display:flex;justify-content:center}
.hero-pick svg{width:160px;height:200px}
.coins{display:inline-block;background:#fff3b0;border:3px solid var(--ink);border-radius:20px;padding:2px 12px;font-weight:900}
/* věž */
.zonebar{text-align:center;font-weight:900;margin-bottom:6px}
.zonebar .bar{max-width:320px;margin:4px auto 0}
.bosslist{display:flex;flex-direction:column;gap:12px}
.bosscard{display:flex;align-items:center;gap:14px;background:#fffbe9;border:4px solid var(--ink);border-radius:14px;padding:10px;position:relative}
.bosscard svg{width:90px;height:108px;flex:none}
.bosscard .info{flex:1}
.bosscard.locked{filter:grayscale(1) brightness(.75);transform:scale(.94)}
.bosscard.current{border-color:var(--red);box-shadow:0 0 0 4px var(--gold)}
.bosscard.mega{background:linear-gradient(#fff3b0,#fffbe9)}
.floor{font-family:Impact,sans-serif;font-size:1.6rem;background:var(--ink);color:var(--gold);border-radius:10px;padding:6px 10px;text-align:center;min-width:64px}
.stat{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-weight:900}
/* obchod / profil */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs .btn{flex:1 1 auto;font-size:.85rem;padding:7px 10px}.tabs .btn.off{background:#b9a77a}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.item{background:#fffbe9;border:5px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.item .ic{font-size:2.4rem}
.item h3{font-size:.95rem}
.item.green{border-color:var(--r-green)}.item.blue{border-color:var(--r-blue)}
.item.yellow{border-color:var(--r-yellow);box-shadow:0 0 12px var(--r-yellow)}
.item.empty{border-style:dashed;opacity:.7}
.item p{margin:6px 0;font-size:.9rem}
.diff{font-size:.78rem;font-weight:700;background:#fff3b0;border-radius:8px;padding:4px 6px;margin:4px 0}
.rar{display:inline-block;font-size:.7rem;font-weight:900;color:#fff;border-radius:8px;padding:1px 8px;text-transform:uppercase}
.rar.green{background:var(--r-green)}.rar.blue{background:var(--r-blue)}.rar.yellow{background:var(--r-yellow);color:var(--ink)}
.shophead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shophead svg{width:90px;height:112px}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.prof .portrait{background:radial-gradient(circle,#fff6d0,#e9c27a);border:5px solid var(--ink);border-radius:18px;padding:8px}
.prof .portrait svg{width:200px;height:250px;display:block}
.prof .pinfo{flex:1;min-width:220px;font-weight:700}
.prof .pinfo .bar{margin:6px 0}
.xp i{background:var(--gold)}
.spells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;text-align:center;font-size:.85rem}
.spells div{background:#fffbe9;border:3px solid var(--ink);border-radius:10px;padding:4px}
.spells b{display:block;font-size:1.2rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slots .item h3{font-size:.8rem}
.slots .item .ic{font-size:1.8rem}
/* paper-doll (profil ve stylu MMO) */
.panel.dark{background:linear-gradient(#2a2f45,#141726);border-color:#0d0f1a;box-shadow:0 6px 0 #0d0f1a,0 0 0 4px #5b6488;color:#e8ecff}
.docname{font-family:Impact,sans-serif;font-size:1.4rem;letter-spacing:1px;text-align:center;margin-bottom:8px;color:#ffd84a;text-transform:uppercase}
.docname small{font-family:inherit;color:#aab4e8}
.doll{max-width:520px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;justify-content:center}
.doll .col{display:flex;flex-direction:column;gap:9px}
.doll .mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.doll .portrait{width:100%;max-width:260px;background:radial-gradient(ellipse at 50% 85%,#5b6488 0,#2a2f45 45%,#171a2a 100%);border:3px solid #5b6488;border-radius:14px;padding:6px;position:relative}
.doll .portrait::after{content:"";position:absolute;left:20%;right:20%;bottom:10px;height:12px;border-radius:50%;background:rgba(0,0,0,.45)}
.doll .portrait svg{width:100%;height:auto;display:block;position:relative;z-index:1}
.trk{display:flex;gap:9px}
.slot{width:62px;height:62px;border-radius:10px;border:3px solid #5b6488;background:radial-gradient(circle,#3e4568,#1c2036);display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;position:relative;box-shadow:inset 0 0 8px #000;color:#fff;transition:transform .08s}
.slot:hover{transform:scale(1.07)}
.slot small{position:absolute;bottom:0;left:0;right:0;font-size:.5rem;text-align:center;color:#c9d0f5;background:rgba(0,0,0,.55);border-radius:0 0 6px 6px;line-height:1.3;font-weight:700}
.slot.empty{opacity:.55;filter:grayscale(1)}
.slot.green{border-color:var(--r-green);box-shadow:inset 0 0 10px rgba(63,163,77,.6),0 0 6px rgba(63,163,77,.5)}
.slot.blue{border-color:var(--r-blue);box-shadow:inset 0 0 10px rgba(47,127,209,.6),0 0 8px rgba(47,127,209,.6)}
.slot.yellow{border-color:var(--r-yellow);box-shadow:inset 0 0 12px rgba(242,183,5,.7),0 0 12px rgba(242,183,5,.8)}
.slot.sel{outline:3px solid #fff;outline-offset:1px}
.slot .on{position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:50%;width:20px;height:20px;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,62px));gap:10px;justify-content:center;background:linear-gradient(#2a2f45,#141726);border:5px solid #0d0f1a;border-radius:14px;padding:14px;min-height:90px;color:#e8ecff}
@media(max-width:560px){.slot{width:48px;height:48px;font-size:1.4rem}.slot small{font-size:.42rem}.doll{gap:6px}.doll .col{gap:6px}.bag{grid-template-columns:repeat(auto-fill,minmax(48px,48px));gap:8px}}
.slotname{font-size:.7rem;font-weight:900;text-transform:uppercase;color:var(--wood-d)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:700;font-size:.85rem;z-index:50;max-width:92vw;text-align:center;display:none}
/* truhla */
.chest{font-size:4.5rem;cursor:pointer;display:inline-block;animation:wiggle 1.2s ease-in-out infinite;user-select:none}
.chest.open{animation:pop .5s}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.drop{display:inline-block;background:#fffbe9;border:5px solid var(--ink);border-radius:14px;padding:8px 14px;margin:6px}
.drop.green{border-color:var(--r-green)}.drop.blue{border-color:var(--r-blue)}.drop.yellow{border-color:var(--r-yellow);box-shadow:0 0 14px var(--r-yellow)}
/* souboj */
.arena{position:relative;background:linear-gradient(#8fd3ff 0,#d8f1ff 55%,#7cc15a 55%,#4c8f35 100%);border:5px solid var(--ink);border-radius:18px;
  box-shadow:0 6px 0 var(--wood-d),0 0 0 4px var(--wood);height:270px;overflow:hidden}
.arena::before{content:"";position:absolute;right:12%;top:14px;width:54px;height:54px;border-radius:50%;background:#ffe45c;border:4px solid var(--ink);box-shadow:0 0 0 8px rgba(255,228,92,.45)}
.arena::after{content:"";position:absolute;left:-10%;right:-10%;bottom:38%;height:60px;background:#5fae48;border-top:4px solid var(--ink);border-radius:50% 50% 0 0/100% 100% 0 0}
.cloud{position:absolute;top:20px;width:70px;height:24px;background:#fff;border:4px solid var(--ink);border-radius:20px;animation:drift 18s linear infinite}
.cloud.c2{top:62px;animation-duration:26s;animation-delay:-9s}
@keyframes drift{from{left:-90px}to{left:105%}}
.fighter::after{content:"";position:absolute;left:10%;right:10%;bottom:-6px;height:14px;border-radius:50%;background:rgba(0,0,0,.3);z-index:-1}
.fighter svg{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
#bossF svg{animation-delay:-.8s}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03) translateY(-3px)}}
.fighter{z-index:2;position:absolute;bottom:6px;width:42%;max-width:190px;transition:transform .25s}
#bossF.mega{max-width:210px;width:46%}
.fighter svg{width:100%;height:auto;display:block;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.25))}
#heroF{left:6%}#bossF{right:6%}
.fighter.lunge-r{transform:translateX(120px) rotate(6deg)}
.fighter.lunge-l{transform:translateX(-120px) rotate(-6deg)}
.fighter.hit{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-5deg)}40%{transform:translateX(14px) rotate(5deg)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.float{position:absolute;font-family:Impact,sans-serif;font-size:2.2rem;pointer-events:none;-webkit-text-stroke:2px var(--ink);animation:floatup 1s forwards;z-index:5}
@keyframes floatup{0%{opacity:1;transform:translateY(0) scale(.6)}30%{transform:translateY(-20px) scale(1.3)}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.pow{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-8deg);font-family:Impact,sans-serif;font-size:3rem;color:var(--gold);
  -webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--red);animation:pow .6s forwards;pointer-events:none;z-index:6}
@keyframes pow{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bar{height:22px;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .4s}
.bar span{position:absolute;inset:0;text-align:center;font-size:.8rem;font-weight:900;line-height:16px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.hp i{background:var(--green)}.bhp i{background:var(--red)}.en i{background:var(--blue)}.tm i{background:var(--gold);transition:none}
.tm{margin-bottom:8px}
.q{font-size:1.6rem;font-weight:900;text-align:center;margin:6px 0 12px}
.q small{display:block;font-size:.8rem;color:var(--wood-d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts .btn{background:#fffbe9;color:var(--ink);text-shadow:none}
.opts .btn.ok{background:var(--green);color:#fff}.opts .btn.bad{background:var(--red);color:#fff}
.attacks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.attacks .btn{font-size:.85rem;padding:8px 4px}.attacks small{display:block;font-weight:700}
.combo{text-align:center;font-weight:900;color:var(--red);min-height:1.4em}
.log{margin-top:12px;font-size:.95rem;min-height:1.3em;text-align:center;font-style:italic}
ul.miss{padding-left:20px;text-align:left;display:inline-block}
@media(max-width:560px){.attacks{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.fighter{max-width:130px}#bossF.mega{max-width:150px}.arena{height:200px}.bosscard svg{width:70px;height:84px}.spells{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">

<!-- ÚVOD -->
<section id="s-start" class="screen active">
  <div class="panel center">
    <h1>⚔️ Angličtina RPG ⚔️</h1>
    <p>Vystup na nekonečnou věž! Každé správné slovíčko nabije energii pro tvé útoky, za výhry dostaneš mince, truhly a kořist.</p>
    <div class="hero-pick" id="startHero"></div>
    <p><label for="name"><b>Jméno hrdiny</b></label><input id="name" type="text" maxlength="14" placeholder="Např. Sir Slovíček"></p>
    <p><b>Tvoje pokročilost</b> <small>(vyšší úroveň = víc mincí)</small></p>
    <div class="levels" id="levels"></div>
    <button class="btn gold" id="startBtn">▶ Vyrazit do věže</button>
  </div>
</section>

<!-- VĚŽ -->
<section id="s-map" class="screen">
  <div class="panel">
    <div class="stat"><span id="mapHero"></span><span id="mapLevel"></span><span id="mapStats"></span></div>
    <p class="center" style="margin-bottom:0"><button class="btn blue" id="profileBtn">👤 Profil a inventář</button> <button class="btn gold" id="shopBtn">🛒 Obchod</button></p>
  </div>
  <div class="zonebar" id="zonebar"></div>
  <h2 class="center">Věž – patro <span id="mapFloor"></span></h2>
  <div class="bosslist" id="bosslist"></div>
  <p class="center"><button class="btn blue" id="backStart">⬅ Změnit hrdinu / úroveň</button></p>
</section>

<!-- PROFIL -->
<section id="s-profile" class="screen">
  <div class="panel dark">
    <div class="docname" id="profName"></div>
    <div class="doll">
      <div class="col" id="slotsL"></div>
      <div class="mid"><div class="portrait" id="profHero"></div><div class="trk" id="slotsB"></div></div>
      <div class="col" id="slotsR"></div>
    </div>
  </div>
  <div class="panel"><div class="pinfo" id="profInfo"></div></div>
  <div id="profDetail"></div>
  <h2 class="center">Inventář</h2>
  <div class="tabs" id="profTabs"></div>
  <div class="bag" id="profInv"></div>
  <p class="center"><button class="btn gold" id="profShop">🛒 Obchod</button> <button class="btn blue" id="profBack">⬅ Zpět do věže</button></p>
</section>

<!-- OBCHOD -->
<section id="s-shop" class="screen">
  <div class="panel">
    <div class="shophead"><div id="shopHero"></div>
      <div><h2 style="margin-top:0">🛒 Obchod</h2><div class="coins" id="shopCoins"></div><div id="shopTotals" style="margin-top:6px;font-weight:700"></div></div></div>
  </div>
  <div class="tabs" id="shopTabs"></div>
  <div class="shopgrid" id="shopGrid"></div>
  <p class="center"><button class="btn blue" id="shopProfile">👤 Profil</button> <button class="btn blue" id="shopBack">⬅ Zpět do věže</button></p>
</section>

<!-- SOUBOJ -->
<section id="s-battle" class="screen">
  <div class="bars">
    <div><b id="bHeroName"></b><div class="bar hp"><i id="hpFill"></i><span id="hpText"></span></div><div class="bar en" style="margin-top:4px"><i id="enFill"></i><span id="enText"></span></div></div>
    <div><b id="bBossName"></b><div class="bar bhp"><i id="bhpFill"></i><span id="bhpText"></span></div></div>
  </div>
  <div class="arena" id="arena"><div class="cloud"></div><div class="cloud c2"></div><div class="fighter" id="heroF"></div><div class="fighter" id="bossF"></div></div>
  <div class="panel">
    <div class="combo" id="combo"></div>
    <div class="bar tm" id="timerBox" style="display:none"><i id="timerFill"></i><span id="timerText"></span></div>
    <div class="q" id="question"></div>
    <div class="opts" id="opts"></div>
    <div id="typeBox" style="display:none"><input type="text" id="typeIn" autocomplete="off" autocapitalize="off" placeholder="Napiš anglicky…"><p class="center"><button class="btn green" id="typeOk">Odpovědět</button></p></div>
    <div class="log" id="log"></div>
  </div>
  <div class="panel"><div class="attacks" id="attacks"></div></div>
  <p class="center"><button class="btn blue" id="fleeBtn">🏃 Utéct</button></p>
</section>

<!-- VÝSLEDEK -->
<section id="s-result" class="screen">
  <div class="panel center">
    <h1 id="resTitle"></h1>
    <div id="resBody"></div>
    <button class="btn gold" id="resBtn">Zpět do věže</button>
    <button class="btn blue" id="resProfile">👤 Profil</button>
    <button class="btn blue" id="resShop">🛒 Obchod</button>
  </div>
</section>

</div>
<div id="toast"></div>

<script>
"use strict";
/* ================= DATA ================= */
// Každá úroveň má ZÓNY (téma slovíček); každá zóna trvá 10 pater, 10. patro je boss zóny.
// Slovíčka: "česky=anglicky". Přidání slov = přidání řetězce do pole `words` zóny (min. 4 slova).
// Po vyčerpání zón se zóny opakují (a bossové dostanou číslo II, III…) s dál rostoucí obtížností.
const LEVELS = {
  A1:{label:"Začátečník", coins:25, hp:80, dmg:12, zones:[
    {theme:"Jídlo", icon:"🍎", boss:{name:"Gobbo Hladovec"}, words:["jablko=apple","chléb=bread","mléko=milk","voda=water","sýr=cheese","vejce=egg","maso=meat","ryba=fish","rýže=rice","káva=coffee","polévka=soup","cukr=sugar","sůl=salt","máslo=butter","pomeranč=orange","banán=banana","zelenina=vegetables","ovoce=fruit","čaj=tea","dort=cake"]},
    {theme:"Zvířata", icon:"🐶", boss:{name:"Zvířecí Medvěd"}, words:["pes=dog","kočka=cat","pták=bird","kůň=horse","kráva=cow","prase=pig","ovce=sheep","slon=elephant","myš=mouse","králík=rabbit","žába=frog","had=snake","lev=lion","tygr=tiger","opice=monkey","medvěd=bear","vlk=wolf","kachna=duck","slepice=hen","motýl=butterfly"]},

// ostatní typy se generují: 2× zelená, 2× modrá, 2× žlutá; bonus roste podle rarity (×1 / ×2,6 / ×6), každý druhý kus je o 25 % lepší
const RAR6 = ["green","green","blue","blue","yellow","yellow"], TIER = {green:1, blue:2.6, yellow:6}, BASE_PRICE = {green:100, blue:700, yellow:3200};
function gen(type, names, icons, stats, factor){
  names.forEach((name, i) => {
    const rar = RAR6[i], odd = i % 2, k = TIER[rar] * (odd ? 1.25 : 1);
    const it = {id:type+(i+1), slot:type, rar, name, icon:icons[i % icons.length], v:odd, price:Math.round(BASE_PRICE[rar]*(odd?1.3:1)*factor/10)*10};
    for(const st in stats) it[st] = Math.max(1, Math.round(stats[st]*k));
    ITEMS.push(it);
  });
}

const SAVE_KEY = "anglictina-rpg-save-v2";
const emptyEquip = () => Object.fromEntries(SLOT_KEYS.map(k => [k, null]));

function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && s.level){
      save = Object.assign(save, s);
      const eq = emptyEquip();
      for(const k of SLOT_KEYS) if(s.equip && ITEM[s.equip[k]]) eq[k] = s.equip[k];
      save.equip = eq;
      save.owned = (save.owned || []).filter(id => { if(ITEM[id]) return true; save.coins += OLD_JEWELRY_REFUND[id] || 0; return false; });
      return;
    }
    const old = JSON.parse(localStorage.getItem("anglictina-rpg-save-v1")); // migrace z v1 (jméno, úroveň, xp)
    if(old){ save.name = old.name || ""; save.level = old.level || "A1"; save.xp = old.xp || 0; }
  }catch(e){}
}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
const heroLevel = () => 1 + Math.floor(save.xp / 100);
const floorNow = () => save.tower[save.level] || 1;
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const equipped = key => save.equip[key] ? ITEM[save.equip[key]] : null;
function totals(){
  const t = {atk:0, hp:0, def:0, en:0, coin:0};
  for(const k of SLOT_KEYS){ const it = equipped(k); if(it) for(const s in t) t[s] += it[s] || 0; }
  t.def = Math.min(60, t.def);
  return t;
}
const heroMaxHp = () => 100 + (heroLevel()-1)*10 + totals().hp;
const attackDmg = a => Math.round(a.dmg * (1 + (heroLevel()-1)*0.05) * (1 + totals().atk/100)); // poškození kouzla s levelem a vybavením
function statsText(it){
  return [it.atk && `+${it.atk} % poškození`, it.hp && `+${it.hp} HP`, it.def && `+${it.def} % obrana`, it.en && `+${it.en} % energie`, it.coin && `+${it.coin} % mincí`].filter(Boolean).join(" · ");

/* ----- nasazování a náhled změn ----- */
const freeSlot = it => TYPES[it.slot].slots.find(k => !save.equip[k]) || TYPES[it.slot].slots[0];
function equipItem(it, key){
  for(const k of SLOT_KEYS) if(save.equip[k] === it.id) save.equip[k] = null;
  save.equip[key || freeSlot(it)] = it.id;
}
function snap(){
  const t = totals();
  return {"❤️ Životy":heroMaxHp(), "🛡️ Obrana":t.def+" %", "🔋 Energie":"+"+t.en+" %", "🪙 Mince":"+"+t.coin+" %",
    [ATTACKS[0].name]:attackDmg(ATTACKS[0]), [ATTACKS[1].name]:attackDmg(ATTACKS[1]), [ATTACKS[2].name]:attackDmg(ATTACKS[2])};
}
function diffText(a, b){
  const d = Object.keys(a).filter(k => a[k] !== b[k]).map(k => `${k}: ${a[k]} → <b>${b[k]}</b>`);
  return d.length ? d.join(" · ") : "beze změny";
}
function previewEquip(it){ // co se změní, když kus nasadím (stav se vrátí zpět)
  const prev = JSON.stringify(save.equip), before = snap();
  equipItem(it); const after = snap();
  save.equip = JSON.parse(prev);
  return diffText(before, after);
}
function toast(html){
  const t = $("toast"); t.innerHTML = html; t.style.display = "block";
  clearTimeout(toastId); toastId = setTimeout(() => t.style.display = "none", 4000);
}
function equipAction(it, a, key){
  const before = snap();
  if(a === "on") equipItem(it, key);
  else if(a === "off"){ for(const k of SLOT_KEYS) if(save.equip[k] === it.id) save.equip[k] = null; }
  else if(a === "sell"){
    if(!confirm(`Prodat ${it.name} za ${sellPrice(it)} mincí?`)) return;
    save.owned.splice(save.owned.indexOf(it.id), 1);
    for(const k of SLOT_KEYS) if(save.equip[k] === it.id) save.equip[k] = null;
    save.coins += sellPrice(it);
  }
  persist();
  const after = snap(), d = diffText(before, after);
  if(a !== "sell" || d !== "beze změny") toast(`${a === "on" ? "Nasazeno" : a === "off" ? "Sundáno" : "Prodáno"}: ${it.name}<br>${d}`);
}
const sellPrice = it => Math.floor(it.price / 2);

// deterministický generátor: stejné patro = stejný nepřítel (náhled i souboj), každé patro jiný
function rngFor(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return () => { h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return ((h ^= h>>>16) >>> 0) / 4294967296; };
}
const pick = (rng, arr) => arr[Math.floor(rng()*arr.length)];
const ADJ = ["Zlobivý","Hladový","Mrzutý","Vzteklý","Líný","Prohnaný","Chlupatý","Šílený","Smradlavý","Ospalý","Divoký","Hrbatý","Zákeřný","Slizký","Nafoukaný","Pomstychtivý"];
const NOUN = ["Goblin","Skřet","Troll","Imp","Ogr","Slizoun","Netopýr","Kostlivec","Yetti","Golem","Démon","Vlkodlak","Zombík","Šotek","Pavoukoun","Faraón"];
// vzhled bosse zóny podle druhu
const BOSS_SPECIES = {"Gobbo Hladovec":"Goblin","Zvířecí Medvěd":"Yetti","Barevný Skřet":"Skřet","Domácí Kostlivec":"Kostlivec","Tělesný Yetti":"Yetti",
  "Cestovní Troll":"Troll","Rodinný Obr":"Ogr","Škodolibý Imp":"Imp","Sportovní Minotaur":"Démon","Nákupní Mumie":"Faraón","Drak Kancelářský":"Démon",
  "Bouřná Harpyje":"Netopýr","Zdravotní Vlkodlak":"Vlkodlak","Citový Kentaur":"Ogr","Městský Kraken":"Slizoun","Lord Argument":"Šotek","Technický Golem":"Golem",
  "Právní Chiméra":"Démon","Ekologická Hydra":"Pavoukoun","Obchodní Ďábel":"Démon","Mistr Idiomů":"Šotek","Stínový Mudrc":"Kostlivec","Pán Zkázy":"Démon",
  "Filozofický Fénix":"Netopýr","Král Jazyka":"Zombík"};
const EYE_COL = ["#d9372b","#2f7fd1","#3fa34d","#8a3fc7","#f2b705","#ff7a00"];
function makeLook(rng){
  return { j:Math.floor(rng()*30)-15, eye:pick(rng,EYE_COL), acc:Math.floor(rng()*5) };
}
function getEnemy(level, f){
  const L = LEVELS[level];
  const zi = Math.floor((f-1) / ZONE_LEN), zone = L.zones[zi % L.zones.length], zround = Math.floor(zi / L.zones.length);
  const isBoss = f % ZONE_LEN === 0;
  const rng = rngFor(level+":"+f);
  const look = makeLook(rng);
  let name, species;
  if(isBoss){
    species = BOSS_SPECIES[zone.boss.name] || "Démon"; look.acc = 0;
    name = "👑 " + zone.boss.name + (zround ? " " + ["","II","III","IV","V","VI","VII","VIII","IX","X"][Math.min(zround,9)] : "");
  } else { const adj = pick(rng,ADJ); species = pick(rng,NOUN); name = adj + " " + species; }
  const growthHp = 1 + 0.12*(f-1), growthDmg = 1 + 0.06*(f-1);
  return {
    name, look, species, isBoss, floor:f, theme:zone.theme, icon:zone.icon, words:zone.words, zone:zi,
    hp: Math.round(L.hp * growthHp * (isBoss ? 2.2 : 0.9 + rng()*0.25)),
    dmg: Math.round(L.dmg * growthDmg * (isBoss ? 1.4 : 0.9 + rng()*0.2))
  };
}
function getDifficulty(f, isBoss){
  return {
    attackEvery: Math.max(2, 5 - Math.floor(f/8) - (isBoss ? 1 : 0)),      // boss útočí i bez chyby každé N-té kolo
    timeLimit: f >= 6 ? Math.max(6, 16 - (f-6)*0.4) : 0,                   // limit na odpověď (s) od 6. patra
    typingChance: Math.min(0.85, Math.max(0, (f-8)*0.1))                   // šance na psaní odpovědi i na nižších úrovních
  };
}

    `<path d="M14 44 Q60 18 106 44 L104 56 Q60 32 16 58Z" fill="#d9372b"/>`, ``][L.acc];
}
function enemySVG(e){
  const crown = e.isBoss ? `<path d="M34 26 L40 2 L52 18 L60 -6 L68 18 L80 2 L86 26Z" fill="#f2b705"/>` : "";
  return `<svg viewBox="-10 -12 140 162" xmlns="http://www.w3.org/2000/svg" stroke="#2b1a10" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
  ${SP[e.species](e.look)}${ACC_OK.includes(e.species) ? accSVG(e.look) : ""}${crown}</svg>`;
}

/* ================= OBRAZOVKY ================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0,0);
}

function renderStart(){
  $("startHero").innerHTML = heroSVG();
  $("name").value = save.name || "";
  $("levels").innerHTML = LEVEL_KEYS.map(k => `<div class="lvl ${k===save.level?"sel":""}" data-k="${k}">${k}<small>${LEVELS[k].label}</small><small>🪙 ×${LEVELS[k].coins}</small></div>`).join("");
  $("levels").querySelectorAll(".lvl").forEach(el => el.onclick = () => { save.level = el.dataset.k; renderStart(); });
}

function renderTower(){
  const lv = LEVELS[save.level], f = floorNow();
  const cur = getEnemy(save.level, f), zoneStart = cur.zone*ZONE_LEN + 1, pos = f - zoneStart + 1;
  $("mapHero").textContent = `🧙 ${save.name} (Lv. ${heroLevel()})`;
  $("mapLevel").textContent = `Úroveň ${save.level} – ${lv.label}`;
  $("mapStats").innerHTML = `<span class="coins">🪙 ${save.coins}</span> ⭐ ${save.xp} XP`;
  $("mapFloor").textContent = f;
  $("zonebar").innerHTML = `Zóna ${cur.zone+1}: ${cur.icon} ${cur.theme} <small>(patra ${zoneStart}–${zoneStart+ZONE_LEN-1})</small>
    <div class="bar"><i style="background:var(--gold);width:${(pos-1)/ZONE_LEN*100}%"></i><span>${pos} / ${ZONE_LEN}${pos===ZONE_LEN?" – BOSS":""}</span></div>`;
  const rows = [];
  for(let i = f+2; i >= f; i--){
    const b = getEnemy(save.level, i), c = i === f;
    rows.push(`<div class="bosscard ${c?"current":"locked"} ${b.isBoss?"mega":""}">
      <div class="floor">${i}.<br><small>patro</small></div>${enemySVG(b)}
      <div class="info"><h3>${b.name}</h3><div>${b.icon} <b>${b.theme}</b></div>
      <div>❤️ ${b.hp} · 💥 ~${b.dmg}${b.isBoss?" · 👑 boss zóny":""}</div>
      ${c ? `<p><button class="btn" id="fightBtn">⚔️ Bojovat</button></p>` : ""}</div></div>`);
  }
  $("bosslist").innerHTML = rows.join("");
  $("fightBtn").onclick = startBattle;
  showScreen("s-map");
}

/* ----- vybavení: společné karty pro obchod a inventář ----- */
function itemCard(it, buttons, withDiff){
  const equippedNow = SLOT_KEYS.some(k => save.equip[k] === it.id);
  return `<div class="item ${it.rar}"><div class="ic">${it.icon}</div><h3>${it.name}</h3><div class="slotname">${TYPES[it.slot].label}</div>
    <span class="rar ${it.rar}">${RARITY[it.rar].name}</span><p>${statsText(it)}</p>
    ${withDiff && !equippedNow ? `<div class="diff">Po nasazení: ${previewEquip(it)}</div>` : ""}${buttons}</div>`;
}
function equipButtons(it){
  const keys = TYPES[it.slot].slots, onKey = keys.find(k => save.equip[k] === it.id);
  if(onKey) return `<b>✅ ${keys.length > 1 ? SLOT_LABEL[onKey] : "Nasazeno"}</b><br><button class="btn small" data-a="off" data-id="${it.id}">Sundat</button>`;
  return keys.map((k,i) => `<button class="btn green small" data-a="on" data-k="${k}" data-id="${it.id}">Nasadit${keys.length > 1 ? " " + (i+1) : ""}</button>`).join("");
}
function typeTabs(current, withAll){
  return (withAll ? [["all","Vše"]] : []).concat(TYPE_KEYS.map(t => [t, TYPES[t].label]))
    .map(([k,n]) => `<button class="btn ${k===current?"":"off"}" data-t="${k}">${n}</button>`).join("");
}
function bindEquip(sel, rerender){
  document.querySelectorAll(sel + " button[data-a]").forEach(b => b.onclick = () => {
    const it = ITEM[b.dataset.id], a = b.dataset.a;
    if(a === "buy"){
      if(save.coins >= it.price){ save.coins -= it.price; save.owned.push(it.id); const b4 = snap(); equipItem(it); persist(); toast(`Koupeno a nasazeno: ${it.name}<br>${diffText(b4, snap())}`); }
    } else equipAction(it, a, b.dataset.k);
    rerender();
  });
}

function renderShop(){
  const t = totals();
  $("shopHero").innerHTML = heroSVG();
  $("shopCoins").textContent = `🪙 ${save.coins} mincí`;
  $("shopTotals").innerHTML = `Bonusy: 💥 +${t.atk} % · ❤️ +${t.hp} HP · 🛡️ ${t.def} % · ⚡ +${t.en} % · 🪙 +${t.coin} %`;
  $("shopTabs").innerHTML = typeTabs(shopType, false);
  $("shopTabs").querySelectorAll("button").forEach(b => b.onclick = () => { shopType = b.dataset.t; renderShop(); });
  $("shopGrid").innerHTML = ITEMS.filter(i => i.slot === shopType).map(it => {
    const own = save.owned.includes(it.id);
    const btn = own ? equipButtons(it)
      : `<button class="btn gold small" data-a="buy" data-id="${it.id}" ${save.coins<it.price?"disabled":""}>Koupit 🪙 ${it.price}</button>`;
    return itemCard(it, btn, true);
  }).join("");
  bindEquip("#shopGrid", renderShop);
  showScreen("s-shop");
}

function renderProfile(){
  const t = totals(), lvl = heroLevel();
  $("profHero").innerHTML = heroSVG();
  $("profInfo").innerHTML = `<h2 style="margin-top:0">🧙 ${save.name}</h2>
    <div>Level <b>${lvl}</b> · ⭐ ${save.xp} XP</div>
    <div class="bar xp"><i style="width:${save.xp%100}%"></i><span>${save.xp%100} / 100 do dalšího levelu</span></div>
    <div>❤️ Max. životy: <b>${heroMaxHp()}</b> · 🛡️ Obrana: <b>${t.def} %</b></div>
    <div>💥 Poškození kouzel: <b>+${Math.round((lvl-1)*5 + t.atk)} %</b> <small>(level ${(lvl-1)*5} % + vybavení ${t.atk} %)</small></div>
    <div>⚡ Energie z odpovědí: <b>+${t.en} %</b> · 🪙 Bonus mincí: <b>+${t.coin} %</b></div>
    <div><span class="coins">🪙 ${save.coins}</span> · 🏰 Nejvyšší patro (${save.level}): <b>${save.best[save.level] || 0}</b></div>
    <div class="spells">${ATTACKS.filter(a => !a.heal).map(a => `<div>${a.name}<b>${attackDmg(a)}</b>dmg (základ ${a.dmg})</div>`).join("")}<div>${ATTACKS[3].name}<b>+${ATTACKS[3].heal}</b>HP</div></div>`;
  /* paper-doll: sloty kolem postavy (jako v MMO) */
  if(profSel && !save.owned.includes(profSel)) profSel = null;
  const tile = (key) => {
    const it = equipped(key), type = TYPE_KEYS.find(t => TYPES[t].slots.includes(key));
    return `<div class="slot ${it ? it.rar : "empty"} ${it && profSel === it.id ? "sel" : ""}" data-k="${key}" title="${it ? it.name + " – " + statsText(it) : SLOT_LABEL[key] + " (prázdné)"}">${it ? it.icon : TYPES[type].label.split(" ")[0]}<small>${SLOT_LABEL[key]}</small></div>`;
  };
  $("profName").innerHTML = `🧙 ${save.name} <small>· Lv. ${lvl}</small>`;
  $("slotsL").innerHTML = ["helmet","shoulders","armor","gloves","belt","boots","amulet"].map(tile).join("");
  $("slotsR").innerHTML = ["weapon","shield","earring1","earring2","ring1","ring2"].map(tile).join("");
  $("slotsB").innerHTML = ["trinket1","trinket2"].map(tile).join("");
  document.querySelectorAll("#s-profile .doll .slot").forEach(el => el.onclick = () => {
    const it = equipped(el.dataset.k);
    if(it) profSel = it.id; else { profSel = null; profType = TYPE_KEYS.find(t => TYPES[t].slots.includes(el.dataset.k)); }
    renderProfile();
  });
  $("profDetail").innerHTML = profSel ? `<div class="shopgrid" style="max-width:260px;margin:0 auto">${itemCard(ITEM[profSel], `${equipButtons(ITEM[profSel])} <button class="btn small" data-a="sell" data-id="${profSel}">Prodat 🪙 ${sellPrice(ITEM[profSel])}</button>`, true)}</div>`
    : `<p class="center"><i>Klikni na slot nebo předmět v inventáři – uvidíš jeho vlastnosti a změnu poškození.</i></p>`;
  $("profTabs").innerHTML = typeTabs(profType, true);
  $("profTabs").querySelectorAll("button").forEach(b => b.onclick = () => { profType = b.dataset.t; renderProfile(); });
  const own = ITEMS.filter(i => save.owned.includes(i.id) && (profType === "all" || i.slot === profType));
  $("profInv").innerHTML = own.length ? own.map(it => {
    const on = SLOT_KEYS.some(k => save.equip[k] === it.id);
    return `<div class="slot ${it.rar} ${profSel === it.id ? "sel" : ""}" data-id="${it.id}" title="${it.name} – ${statsText(it)}">${it.icon}${on ? "<b class=\"on\">✔</b>" : ""}<small>${TYPES[it.slot].label.split(" ")[0]}</small></div>`;
  }).join("") : `<div class="center" style="grid-column:1/-1">Tady zatím nic není. Kup si vybavení v obchodě nebo ho získej po bojích!</div>`;
  $("profInv").querySelectorAll(".slot").forEach(el => el.onclick = () => { profSel = el.dataset.id; renderProfile(); });
  bindEquip("#profDetail", renderProfile);
  showScreen("s-profile");
}

/* ================= SOUBOJ ================= */
function startBattle(){
  const f = floorNow(), boss = getEnemy(save.level, f), maxHp = heroMaxHp();
  battle = { boss, floor:f, diff:getDifficulty(f, boss.isBoss), heroMax:maxHp, hero:maxHp, bossHp:boss.hp, energy:0, combo:0, turn:0,
             mistakes:{}, correct:0, deck:[], q:null, locked:false, typing:false, over:false };
  $("heroF").innerHTML = heroSVG();
  $("bossF").innerHTML = enemySVG(boss);
  $("bossF").classList.toggle("mega", boss.isBoss);
  $("bHeroName").textContent = `🧙 ${save.name}`;
  $("bBossName").textContent = `${f}. patro · ${boss.name}`;
  $("attacks").innerHTML = ATTACKS.map(a => `<button class="btn ${a.color}" data-a="${a.id}">${a.name}<small>${a.heal?`+${a.heal} HP`:`${attackDmg(a)} dmg`} · ${a.cost} ⚡</small></button>`).join("");
  $("attacks").querySelectorAll("button").forEach(b => b.onclick = () => useAttack(b.dataset.a));
  const d = battle.diff;
  $("log").textContent = `${boss.icon} ${boss.theme}: ${boss.name} se objevil!` + (d.timeLimit ? ` Na odpověď máš ${d.timeLimit.toFixed(0)} s.` : " Odpovídej správně, abys získal energii.");
  showScreen("s-battle");
  updateBars();
  nextQuestion();
}

function updateBars(){
  const b = battle;
  const set = (f,t,v,m) => { $(f).style.width = Math.max(0,v/m*100)+"%"; $(t).textContent = `${Math.max(0,Math.round(v))} / ${m}`; };
  set("hpFill","hpText",b.hero,b.heroMax);
  set("bhpFill","bhpText",b.bossHp,b.boss.hp);
  set("enFill","enText",b.energy,100);
  $("combo").textContent = b.combo >= 2 ? `🔥 Kombo ×${b.combo}!` : "";
  document.querySelectorAll("#attacks button").forEach(btn => {
    const a = ATTACKS.find(x => x.id === btn.dataset.a);
    btn.disabled = b.over || b.energy < a.cost || (a.heal && b.hero >= b.heroMax);
  });
}

function clearTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function startTimer(sec){
  clearTimer();
  $("timerBox").style.display = sec ? "block" : "none";
  if(!sec) return;
  const t0 = Date.now();
  const tick = () => {
    const left = sec - (Date.now()-t0)/1000;
    $("timerFill").style.width = Math.max(0,left/sec*100) + "%";
    $("timerText").textContent = Math.max(0,left).toFixed(1) + " s";
    if(left <= 0){ clearTimer(); answer("", null, true); }
  };
  timerId = setInterval(tick, 100); tick();
}

function nextQuestion(){
  const b = battle;
  if(!b || b.over) return;
  if(b.deck.length === 0) b.deck = shuffle(b.boss.words);
  const [cz,en] = b.deck.pop().split("=");
  b.q = {cz,en}; b.locked = false;
  b.typing = TYPING_LEVELS.includes(save.level) || Math.random() < b.diff.typingChance;
  $("question").innerHTML = `<small>Přelož do angličtiny:</small>${cz}`;
  $("typeBox").style.display = b.typing ? "block" : "none";
  $("opts").style.display = b.typing ? "none" : "grid";
  if(b.typing){
    $("typeIn").value = ""; $("typeIn").disabled = false; $("typeOk").disabled = false; $("typeIn").focus();
  } else {
    const pool = b.boss.words.map(w => w.split("=")[1]).filter(w => w !== en);
    const opts = shuffle([en, ...shuffle(pool).slice(0,3)]);
    $("opts").innerHTML = opts.map(o => `<button class="btn">${o}</button>`).join("");
    $("opts").querySelectorAll("button").forEach(btn => btn.onclick = () => answer(btn.textContent, btn));
  }
  startTimer(b.diff.timeLimit);
}

function answer(given, btn, timedOut){
  const b = battle;
  if(!b || b.locked || b.over) return;
  b.locked = true; clearTimer();
  const ok = given.trim().toLowerCase() === b.q.en.toLowerCase();
  if(btn) btn.classList.add(ok ? "ok" : "bad");
  if(!ok && !b.typing) [...$("opts").children].forEach(x => { if(x.textContent === b.q.en) x.classList.add("ok"); });
  if(b.typing){ $("typeIn").disabled = true; $("typeOk").disabled = true; }
  b.turn++;
  if(ok){
    b.correct++; b.combo++;
    const gain = Math.round((10 + Math.min(b.combo-1,5)*3) * (1 + totals().en/100));
    b.energy = Math.min(100, b.energy + gain);
    $("log").textContent = `✅ Správně! +${gain} ⚡`;
    floatText($("heroF"), `+${gain}⚡`, "#2f7fd1");
    updateBars();
    setTimeout(afterTurn, 700);
  } else {
    b.combo = 0;
    b.mistakes[b.q.cz] = b.q.en;
    $("log").textContent = `${timedOut ? "⏰ Čas vypršel!" : "❌"} Správně: „${b.q.en}“. Boss útočí!`;
    updateBars();
    setTimeout(() => bossAttack(afterTurn), 900);
  }
}

function afterTurn(){
  if(!battle || battle.over) return;
  if(battle.turn % battle.diff.attackEvery === 0) return bossAttack(nextQuestion);
  nextQuestion();
}

function bossAttack(cb){
  const b = battle;
  if(!b || b.over) return;
  const dmg = Math.max(1, Math.round(b.boss.dmg * (0.8 + Math.random()*0.4) * (1 - totals().def/100)));
  lunge($("bossF"), "lunge-l", () => {
    if(b.over) return;
    b.hero -= dmg;
    hitFx($("heroF"), `-${dmg}`, "#d9372b", "OUCH!");
    updateBars();
    if(b.hero <= 0) return endBattle(false);
    setTimeout(cb, 600);
  });
}

function useAttack(id){
  const b = battle, a = ATTACKS.find(x => x.id === id);
  if(!b || b.over || b.energy < a.cost) return;
  b.energy -= a.cost;
  if(a.heal){
    b.hero = Math.min(b.heroMax, b.hero + a.heal);
    floatText($("heroF"), `+${a.heal} HP`, "#3fa34d"); pow(a.pow);
    $("log").textContent = "Vyléčil ses.";
    return updateBars();
  }
  const dmg = attackDmg(a);
  lunge($("heroF"), "lunge-r", () => {
    if(b.over) return;
    b.bossHp -= dmg;
    hitFx($("bossF"), `-${dmg}`, "#f2b705", a.pow);
    $("log").textContent = `Zasáhl jsi bosse za ${dmg}!`;
    updateBars();
    if(b.bossHp <= 0) endBattle(true);
  });
  updateBars();
}

/* ----- kořist a truhla ----- */
function rollDrop(isBoss){
  const cfg = isBoss ? DROP.boss : DROP.normal;
  if(Math.random() > cfg.chance) return null;
  let r = Math.random() * Object.values(cfg.w).reduce((a,c) => a+c, 0), rar = "green";
  for(const k in cfg.w){ if((r -= cfg.w[k]) < 0){ rar = k; break; } }
  return pick(Math.random, ITEMS.filter(i => i.rar === rar));
}
function endBattle(won){
  const b = battle;
  b.over = true; clearTimer(); updateBars();
  const miss = Object.entries(b.mistakes), f = b.floor, boss = b.boss;
  const base = LEVELS[save.level].coins, cb = 1 + totals().coin/100;
  let reward = Math.round(base * (1 + (f-1)*0.1) * cb);
  let html = "", chest = 0;
  if(won){
    if(!miss.length) reward = Math.round(reward*1.2);
    const xp = 30 + f*2 + (boss.isBoss ? 50 : 0), before = heroLevel();
    save.xp += xp; save.tower[save.level] = f + 1;
    save.best[save.level] = Math.max(save.best[save.level] || 0, f);
    chest = Math.round(base * (1.5 + f*0.2) * (0.8 + Math.random()*0.5) * cb * (boss.isBoss ? 3 : 1));
    html = `<p>Porazil jsi <b>${boss.name}</b> a postupuješ na <b>${f+1}. patro</b>!</p>
            <p>🪙 +${reward} mincí${miss.length?"":" (bonus za bezchybný souboj ×1.2)"} · ⭐ +${xp} XP · správně: ${b.correct}</p>` +
           (heroLevel() > before ? `<p><b>🎉 Nový level hrdiny: ${heroLevel()}!</b></p>` : "");
    const drop = rollDrop(boss.isBoss);
    if(drop){
      let note;
      if(save.owned.includes(drop.id)){ save.coins += sellPrice(drop); note = `už ho máš – prodáno za 🪙 ${sellPrice(drop)}`; }
      else {
        save.owned.push(drop.id);
        const free = TYPES[drop.slot].slots.find(k => !save.equip[k]);
        if(free) save.equip[free] = drop.id;
        note = "přidáno do inventáře" + (free ? " a nasazeno" : "");
      }
      html += `<h3>🎲 Kořist!</h3><div class="drop ${drop.rar}"><span style="font-size:2.4rem">${drop.icon}</span><br><b>${drop.name}</b><br><small>${TYPES[drop.slot].label}</small><br><span class="rar ${drop.rar}">${RARITY[drop.rar].name}</span><br><small>${statsText(drop)}<br>${note}</small></div>`;
    }
    html += `<h3>${boss.isBoss ? "👑 Velká truhla" : "Truhla"} – klikni!</h3><div class="chest" id="chest" title="Otevřít">🎁</div><div id="chestOut"></div>`;
    $("resTitle").textContent = "🏆 Vítězství!";
    $("resBtn").textContent = "▶ K dalšímu patru";
  } else {
    reward = Math.round(reward*0.25);
    html = `<p>${boss.name} tě porazil na ${f}. patře… Zkus to znovu!</p><p>🪙 útěcha: +${reward} mincí</p>`;
    $("resTitle").textContent = "💀 Porážka";
    $("resBtn").textContent = "Zpět do věže";
  }
  save.coins += reward + chest; persist();
  html += miss.length ? `<h3>Slovíčka k procvičení</h3><ul class="miss">${miss.map(([c,e]) => `<li>${c} = <b>${e}</b></li>`).join("")}</ul><br>` : (won ? `<p>Bez jediné chyby! 💯</p>` : "");
  setTimeout(() => {
    $("resBody").innerHTML = html; showScreen("s-result");
    const c = $("chest");
    if(c) c.onclick = () => { c.classList.add("open"); c.textContent = "💰"; c.onclick = null;
      $("chestOut").innerHTML = `<p><b>V truhle bylo 🪙 ${chest} mincí!</b></p>`; };
  }, 900);
}

/* ===== efekty ===== */
function floatText(target, text, color){
  const arena = $("arena"), r = target.getBoundingClientRect(), ar = arena.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text; el.style.color = color;
  el.style.left = (r.left - ar.left + r.width/3) + "px"; el.style.top = (r.top - ar.top) + "px";
  arena.appendChild(el); setTimeout(() => el.remove(), 1000);
}
function pow(text){
  const el = document.createElement("div"); el.className = "pow"; el.textContent = text;
  $("arena").appendChild(el); setTimeout(() => el.remove(), 600);
}
function hitFx(target, text, color, powText){
  target.classList.add("hit"); setTimeout(() => target.classList.remove("hit"), 400);
  floatText(target, text, color); pow(powText);
}
function lunge(el, cls, cb){
  el.classList.add(cls);
  setTimeout(() => { el.classList.remove(cls); cb(); }, 260);
}

/* ================= UDÁLOSTI ================= */
$("startBtn").onclick = () => {
  const n = $("name").value.trim();
  if(!n){ $("name").focus(); $("name").style.borderColor = "#d9372b"; return; }
  save.name = n; persist(); renderTower();
};
$("backStart").onclick = () => { renderStart(); showScreen("s-start"); };
for(const id of ["shopBtn","resShop","profShop"]) $(id).onclick = renderShop;
for(const id of ["profileBtn","resProfile","shopProfile"]) $(id).onclick = renderProfile;
for(const id of ["shopBack","profBack","resBtn"]) $(id).onclick = renderTower;
$("fleeBtn").onclick = () => { if(battle) battle.over = true; clearTimer(); renderTower(); };
$("typeOk").onclick = () => answer($("typeIn").value);
$("typeIn").addEventListener("keydown", e => { if(e.key === "Enter") answer($("typeIn").value); });

loadSave(); renderStart();
</script>
